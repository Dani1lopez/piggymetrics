# .github/workflows/main.yml
name: AzureSpringApps
on: push
env:
  ASC_PACKAGE_PATH: ${{ github.workspace }}
  AZURE_SUBSCRIPTION: "ae0f6124-88af-47e1-903a-0e6ba52e5972"

jobs:
  deploy_to_production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build with Maven
        run: |
          mvn -v  # Verifica la versión de Java
          mvn clean package -pl auth-service -DskipTests  # Genera el JAR

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Spring Apps
        uses: azure/spring-apps-deploy@v1
        with:
          azure-subscription: ${{ env.AZURE_SUBSCRIPTION }}
          service-name: miinstanciaspringapps
          app-name: miapp-spring
          package: ${{ env.ASC_PACKAGE_PATH }}/auth-service/target/*.jar  # Asegura el path
